<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prokopis Georgiou</title>
    <!--
      GitHub Pages serves this static file for any unknown path (since it
      has no server-side rewrites). It re-encodes the requested path into
      a query string and redirects to the site root, where the inline
      script in index.html decodes it back into the real URL via
      history.replaceState — restoring deep-link/refresh support for the
      client-side router without a real backend. Standard "spa-github-pages"
      technique: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      // 0: served from the root of georgiou.pro (no subpath segment).
      var segmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
